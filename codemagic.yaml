definitions:
  instance_type: mac_mini_m1
workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Clean project
        script: |
          rm -rf android
      - name: Force Modern Android Generation
        script: |
          flutter create . --platforms=android --org com.shopopop
      - name: Build Android APK
        script: |
          flutter build apk --debug --build-name=1.0.0 --build-number=1
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
