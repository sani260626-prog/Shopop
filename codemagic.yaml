workflows:
  default_workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - default
    scripts:
      - name: Build Clean Isolated App
        script: |
          # 1. Create a perfectly fresh Flutter app layout
          flutter create fresh_app --org com.shopopop --project-name fresh_app
          
          # 2. Add the required icon package to the fresh app
          cd fresh_app && flutter pub add lucide_icons_flutter && cd ..

          # 3. Copy your custom main.dart file into this fresh workspace
          cp lib/main.dart fresh_app/lib/main.dart

          # 4. Move into that fresh workspace and compile the APK
          cd fresh_app
          flutter build apk --debug
    artifacts:
      - fresh_app/build/app/outputs/flutter-apk/*.apk
