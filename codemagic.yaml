workflows:
  default_workflow:
    name: Default Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - default
    scripts:
      - name: Build Clean Isolated App
        script: |
          # 1. Create a perfectly fresh Flutter app layout
          flutter create fresh_app --org com.shopopop --project-name fresh_app
          
          # 2. Add required icon packages to the fresh app
          cd fresh_app
          flutter pub add lucide_icons_flutter
          flutter pub add --dev flutter_launcher_icons
          
          # 3. Create the launcher configuration referencing your asset image
          cat << 'EOF' > flutter_launcher_icons.yaml
          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "../assets/icon.png"
            remove_alpha_ios: true
          EOF
          
          # 4. Generate the Android launcher icon files
          flutter pub run flutter_launcher_icons

          # 5. THE FIX FOR MAIN.DART: Register the map image in Flutter's config
          sed -i '' 's/# assets:/assets:/g' pubspec.yaml
          sed -i '' 's/#   - images\/a_dot_burr.jpeg/  - assets\/map_bg.png/g' pubspec.yaml

          # 6. Copy the map image into the fresh build folder so main.dart can find it
          mkdir -p assets
          cp ../assets/map_bg.png assets/map_bg.png

          # 7. Copy your custom main.dart file into this fresh workspace
          cp ../lib/main.dart lib/main.dart

          # 8. Correctly patch the App Display Name for the mobile home screen
          sed -i '' 's/android:label="fresh_app"/android:label="Shopopop"/g' android/app/src/main/AndroidManifest.xml

          # 9. Compile the APK
          flutter build apk --debug
    artifacts:
      - fresh_app/build/app/outputs/flutter-apk/*.apk
