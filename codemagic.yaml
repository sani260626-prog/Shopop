definitions:
  instance_type: mac_mini_m1
workflows:
  default-workflow:
    name: Default Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build Clean Isolated App
        script: |
          # 1. Create a perfectly fresh Flutter app layout in a separate folder
          flutter create fresh_app --org com.shopopop --project-name shopopop
          
          # 2. Copy your custom main.dart file into this fresh workspace
          cp lib/main.dart fresh_app/lib/main.dart
          
          # 3. Move into that fresh workspace and compile the APK safely
          cd fresh_app
          flutter build apk --debug
    artifacts:
      - fresh_app/build/app/outputs/flutter-apk/*.apk
